name: Quick Test Build

# Manual only: on push this built exactly the same FOSS release APK as the
# "Build Release (foss)" job in build.yml, doubling the cost of every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (No Lint)
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.test
          METROLIST_APP_NAME: Metrolist Pro Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign & Prepare Release APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          TARGET_NAME="app-universal-test-release.apk"

          BUILD_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$BUILD_APK" ]; then
            echo "No built APK found in $OUTPUT_DIR"
            exit 1
          fi

          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "Signing release APK with native apksigner..."
            echo "${{ secrets.KEYSTORE }}" | tr -d ' \n\r' | base64 -d > temp_release.keystore

            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --ks temp_release.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$OUTPUT_DIR/out/$TARGET_NAME" \
              "$BUILD_APK"

            rm -f temp_release.keystore
            echo "APK signed successfully and saved to $OUTPUT_DIR/out/$TARGET_NAME"
          else
            echo "KEYSTORE secret not set, copying unsigned APK..."
            cp "$BUILD_APK" "$OUTPUT_DIR/out/$TARGET_NAME"
          fi

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
