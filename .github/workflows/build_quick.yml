name: Quick Test Build

# Manual only: on push this built exactly the same FOSS release APK as the
# "Build Release (foss)" job in build.yml, doubling the cost of every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (No Lint)
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.metrolist.pro
          METROLIST_APP_NAME: Metrolist Pro Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Prepare Release APK Artifact
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          TARGET_NAME="Metrolist-Pro-test-release.apk"

          BUILD_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -n "$BUILD_APK" ]; then
            cp "$BUILD_APK" "$OUTPUT_DIR/out/$TARGET_NAME"
            echo "Release APK prepared: $OUTPUT_DIR/out/$TARGET_NAME"
          else
            echo "No APK found in $OUTPUT_DIR"
            exit 1
          fi

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-test-release
          path: app/build/outputs/apk/foss/release/out/*
