name: Quick Test Build

# Manual only: on push this built exactly the same FOSS release APK as the
# "Build Release (foss)" job in build.yml, doubling the cost of every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (No Lint)
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.test
          METROLIST_APP_NAME: Metrolist Pro Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign & Prepare Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          TARGET_NAME="app-universal-test-release.apk"

          BUILD_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$BUILD_APK" ]; then
            echo "No built APK found in $OUTPUT_DIR"
            exit 1
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Attempting to decode KEYSTORE secret..."
            python3 -c "import base64, os, re; raw = os.environ.get('KEYSTORE_BASE64', ''); b64 = re.sub(r'[^A-Za-z0-9+/=]', '', raw); open('temp_release.keystore', 'wb').write(base64.b64decode(b64))" 2>/dev/null || true

            if [ -s temp_release.keystore ]; then
              echo "Signing release APK with native apksigner..."
              $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
                --ks temp_release.keystore \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out "$OUTPUT_DIR/out/$TARGET_NAME" \
                "$BUILD_APK" || cp "$BUILD_APK" "$OUTPUT_DIR/out/$TARGET_NAME"
              rm -f temp_release.keystore
              echo "APK prepared successfully in $OUTPUT_DIR/out/$TARGET_NAME"
            else
              echo "KEYSTORE secret could not be decoded — copying built release APK..."
              cp "$BUILD_APK" "$OUTPUT_DIR/out/$TARGET_NAME"
            fi
          else
            echo "KEYSTORE secret not set — copying built release APK..."
            cp "$BUILD_APK" "$OUTPUT_DIR/out/$TARGET_NAME"
          fi

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
